<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Snapps</title>
</head>

<body>
    <header class="container-fluid" id="v-navbar">
        <nav class="navbar navbar-expand-lg navbar-snapps px-3">
            <button class="btn btn-menu d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#demo">
                <i class="navbar-toggler-icon"></i>
            </button>
        
            <a href="#" class="navbar-brand mx-2">
                <img id="logo" src="./assets/snapps_logo.png" alt="Logo">
            </a>
        
            <form class="search-bar d-flex mx-3 flex-grow-1">
                <input class="form-control search-input" type="text"
                    placeholder="Search everything at Snapps online and in store">
                <button class="btn btn-search" type="button">
                    <i class="fa fa-search"></i>
                </button>
            </form>
        
            <div class="cart-area align-items-center">
                <i class="fa fa-shopping-cart cart-icon"></i>
                <span class="cart-price">$0.00</span>
            </div>
        </nav>


        <!--Off Canvas-->
        <div class="offcanvas offcanvas-start offcanvas-lg" id="demo">
            <div class="offcanvas-header">
                <h1 class="offcanvas-title">Heading</h1>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <p>Some text lorem ipsum.</p>
                <p>Some text lorem ipsum.</p>
                <p>Some text lorem ipsum.</p>
                <button class="btn btn-secondary" type="button">A Button</button>
            </div>
        </div>
        <!--Off Canvas-->
    </header>
    <main class="container">
        <section class="container">

        </section>
    </main>
    <footer class="container-fluid">

    </footer>
</body>

</html>
